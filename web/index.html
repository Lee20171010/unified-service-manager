<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#173e35" />
    <script src="theme.js?v=0.3.0"></script>
    <title>Unified — Service Manager</title>
    <link rel="icon" type="image/png" sizes="64x64" href="assets/favicon.png?v=0.3.2" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png?v=0.3.2" />
    <link rel="stylesheet" href="styles.css?v=0.5.0" />
    <link rel="stylesheet" href="theme.css?v=0.3.0" />
    <script type="module" src="app.js?v=0.5.0"></script>
  </head>
  <body>
    <aside class="sidebar">
      <a class="brand" href="#services"
        ><img class="brand-mark" src="assets/unified-brand.png?v=0.3.2" alt="" width="40" height="40"
        ><span>unified<span class="brand-sub">SERVICE MANAGER</span></span></a
      >
      <div class="workspace">
        <span class="workspace-icon">H</span>
        <div>Homelab<span>Personal workspace</span></div>
        <span class="workspace-dot"></span>
      </div>
      <div class="nav-label">WORKSPACE</div>
      <nav aria-label="主要導覽" id="navigation"></nav>
      <div class="sidebar-bottom">
        <button class="architecture-link" data-action="architecture">
          架構與功能對等 <span>↗</span>
        </button>
        <div class="profile">
          <span class="avatar">H</span>
          <div>Homelab admin<span>個人工作區</span></div>
          <span class="small-badge">V1</span>
        </div>
      </div>
    </aside>
    <div class="shell">
      <header class="topbar">
        <div>
          <img class="mobile-brand" src="assets/unified-brand.png?v=0.3.2" alt="Unified" width="28" height="28" />
          <span class="breadcrumb">Workspace</span><span class="slash">/</span
          ><span id="breadcrumb">服務總覽</span>
        </div>
        <div class="topbar-right">
          <select id="theme-mode" aria-label="外觀模式" title="外觀模式">
            <option value="system">跟隨系統</option>
            <option value="light">淺色</option>
            <option value="dark">深色</option>
          </select>
          <button class="button compact server-control" id="server-control" data-action="connect" aria-label="伺服器設定">
            <i class="server-dot" aria-hidden="true"></i><span>伺服器</span><span aria-hidden="true">⌄</span>
          </button>
        </div>
      </header>
      <div id="connection-notice" class="connection-notice" role="status" hidden></div>
      <main id="main"></main>
      <footer class="page-footer">
        <span>Unified Service Manager</span
        ><span>多主機服務管理</span>
      </footer>
    </div>
    <div id="job-dock"></div>
    <dialog id="modal" aria-labelledby="modal-title"></dialog>
    <dialog
      id="console"
      class="console-dialog"
      aria-labelledby="console-title"
    ></dialog>
    <div id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
